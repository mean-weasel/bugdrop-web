version: 2

goal:
  title: "Living Flow Capability Documentation"
  slug: "flow-capability-documentation"
  kind: specific
  tranche: "Complete the released flow capability reference, curated live examples, and automated drift/browser proof without building a visual editor or enabling production."
  status: done
  oracle:
    signal: "Exact released-type inventory matches navigable docs and working component, motion, and styling examples on desktop/mobile with no external mutation."
    cadence: "after each Worker package and at final audit"
    final_proof: "Machine inventory parity, focused tests, production build, accessible desktop/mobile browser walkthrough, reduced-motion proof, no-external-request ledger, and final Judge mapping to the owner outcome."
  intake:
    original_request: "Plan how to keep website documentation current for available flow components, animations, and styling, with docs plus live examples."
    interpreted_outcome: "bugdrop.dev becomes a living, accurate, visually useful guide to the default feedback flow and the released custom-flow SDK."
    input_shape: specific
    audience: "Developers evaluating or implementing BugDrop and product visitors exploring customization"
    authority: requested
    proof_type: demo
    completion_proof: "A verified local documentation experience plus CI drift gates covers the exact released SDK surface and retains the default flow as the primary entry point."
    likely_misfire: "Ship attractive but incomplete docs, expose lab-only capabilities, or create a second source of truth that drifts from the SDK."
    blind_spots_considered:
      - "Flow versus Variant capability differences"
      - "Reduced motion and keyboard/accessibility behavior"
      - "Shadow DOM styling boundaries"
      - "Exact release provenance and future drift"
      - "Local examples accidentally creating public Issues"
    existing_plan_facts:
      - "Preserve the default feedback flow as the primary starting point."
      - "Add authoritative docs plus curated live examples, not a full visual editor."
      - "Cover components, screens, branching, motion, styling, API lifecycle, evidence, and output."
      - "Use CI to detect capability/documentation drift."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/flow-capability-documentation/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/flow-capability-documentation"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Audit the exact released SDK capability surface, current website documentation, examples, navigation, and verification gaps."
    inputs:
      - "Authenticated v1.56.3 public Flow and Variant type declarations"
      - "Current docs navigation and MDX content"
      - "Current homepage examples and labs"
      - "Current unit, browser, and CI contracts"
    constraints:
      - "Read-only."
      - "Include the complete intended dirty worktree and preserve unrelated edits."
      - "Separate released Flow capabilities from Variant-only and lab-only concepts."
    expected_output:
      - "Exact capability inventory with source evidence"
      - "Documentation and example gap map"
      - "Current verification commands and known pre-existing noise"
      - "Recommended information architecture and safe file ownership boundaries"
    receipt:
      result: done
      summary: "Authenticated v1.56.3 types expose six Flow fields, three screens, composable conditions, modal/layout/appearance controls, five built-in/immediate transition choices plus custom motion, issue/evidence mapping, and open/result lifecycle. Current docs cover the default widget and Variants but omit registerFlow and authoritative Flow references. Homepage/lab examples exercise useful subsets; the simulator separately advertises unreleased multiSelect. Existing focused tests pass, while CI/browser contracts do not prove exhaustive type/docs parity, every motion/style option, or reduced-motion accessibility. Recommended IA: preserve Getting Started; add Custom Flows and Flow Reference, then extend JavaScript API and Styling. Prefer new manifest/example/test files and clean docs files; coordinate carefully around already-dirty homepage, CI, integration, and e2e files."
      evidence:
        - source: "GitHub API, mean-weasel/bugdrop@47a392d1e7b1a8d8adeff1692f6bbbd84696280d: src/widget/flows/public-types.d.ts"
          proves: "Exact authenticated FlowConfig, field/screen/condition/transition/issue/evidence/open/outcome discriminators."
        - source: "GitHub API, same commit: src/widget/variants/public-types.d.ts"
          proves: "Exact Variant field primitives and Variant-only inline, feedback classification, mount, and headless submit capabilities."
        - source: "GitHub API, same commit: README.md and screen-transition-config.ts/screen-transition.ts"
          proves: "Immediate default; slide-horizontal, slide-vertical, fade, scale-fade and custom motion; 100–1000ms validation; defaults 500/500/350/450ms; direction reversal and reduced-motion replacement."
        - source: public/vendor/bugdrop/47a392d1e7b1a8d8adeff1692f6bbbd84696280d/PROVENANCE.json
          proves: "Vendored runtime is release v1.56.3, exact target commit, byte length 238591 and SHA-256 338cdb5b19c69dc3429fdcb8f800e3b98a3bdd442fee78563523cd731e2bdf0e."
        - source: "src/lib/docs-nav.ts and src/content/docs/{configuration,styling,javascript-api}.mdx"
          proves: "No Flow navigation/page; API documents registerVariant but not registerFlow; styling documents script attributes/Shadow DOM but not Flow appearance/presentation."
        - source: "src/components/landing/homepage-flow-recipes.generated.ts and homepage-flow-demo-recipes.ts"
          proves: "Current exact-runtime examples cover all six fields and three screens plus selected conditions, layouts, appearance, issue/evidence mappings, but all homepage demos force the same 500ms horizontal transition."
        - source: "src/components/variants-lab/model.ts versus public-flow-configs.ts"
          proves: "Simulator model advertises multiSelect, while exact-runtime lab configs use released fields; these concepts are currently mixed under one lab route."
        - source: ".github/workflows/ci.yml, test/integration-resource.test.ts, e2e/homepage-flow-demo.spec.ts, e2e/public-flow-lab.spec.ts"
          proves: "Desktop/mobile and local no-external-mutation checks exist, but there is no exhaustive capability-manifest parity gate or every-transition/style/reduced-motion docs journey."
        - source: "git status --short"
          proves: "Dirty baseline includes CI, homepage implementation/tests/docs, deleted old runtime routes/assets, and untracked v1.56.3 runtime/routes/goals; public docs MDX and docs navigation are currently clean."
        - source: "Focused Vitest run"
          proves: "49 tests across five homepage/integration suites passed on current dirty head."
        - source: "Focused ESLint attempt"
          proves: "Command failed because the directory argument src/content/docs is ignored by ESLint; MDX must be verified by build/content tests rather than passing that directory to ESLint."
      facts:
        - capability_inventory: "[object Object]"
        - variant_only_not_flow: "presentation.kind=inline,classification=feedback,handle.mount,handle.submit headlessly,VariantContent requirement"
        - lab_only_unreleased: "multiSelect simulator field"
        - documentation_gap_map: "No Custom Flows or Flow Reference navigation,No registerFlow API contract or lifecycle examples,No complete field/screen/condition/layout/evidence/output reference,No built-in/custom transition catalog, bounds, defaults, direction, or reduced-motion explanation,No Flow appearance/presentation styling guidance or clear Shadow DOM boundary,No release provenance/version badge on public capability reference,Homepage building-block link lands on a mixed simulator/exact-runtime lab rather than authoritative docs"
        - recommended_information_architecture: "Keep Getting Started/default feedback first,Add Custom Flows guide after Configuration,Add Flow Reference immediately after Custom Flows, driven by one versioned manifest,Extend JavaScript API with registerFlow/open/result/close/context/initialAnswers,Extend Styling with Flow appearance/presentation and explicit no-arbitrary-CSS claim,Provide curated local exact-runtime examples inside docs/reference, not a visual builder; link homepage examples to them"
        - safe_ownership_boundaries: "[object Object]"
        - verification_commands: "npm test -- --run test/homepage-flow-demo-recipes.test.ts test/homepage-flow-recipes.test.ts test/homepage-demo-runtime.test.ts test/homepage-demo-model.test.ts test/integration-resource.test.ts,npm run build,npm run lint -- <changed .ts/.tsx files only>,npx playwright test <new docs-flow spec> --project=desktop-chromium --project=mobile-chromium --retries=0,git diff --check"
      contradictions:
