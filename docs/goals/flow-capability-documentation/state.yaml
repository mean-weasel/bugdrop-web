          drift_contract: "A TypeScript-AST parity helper extracts the released discriminators, literal values, and numeric/runtime constraints from the snapshots and deep-compares them with the manifest; it also checks the manifest commit/version/runtime digest against the vendored runtime provenance. Documentation tables and example selectors import the manifest and may not repeat complete hand-maintained capability arrays."
        example_strategy:
          - "Embed one curated exact-runtime gallery in Custom Flows, with reference-page deep links rather than a separate public lab."
          - "Cover all six fields and three screens through a small set of coherent example flows, including branching, layout, issue formatting, evidence, and lifecycle."
