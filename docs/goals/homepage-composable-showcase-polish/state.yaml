version: 2

goal:
  title: "Homepage Composable Showcase Polish"
  slug: "homepage-composable-showcase-polish"
  kind: existing_plan
  tranche: "Validate the independent critique, finish the largest safe website polish slice, then prepare the separately gated SDK handoff."
  status: done
  oracle:
    signal: "A desktop-and-mobile walkthrough of all five hidden homepage experiences is polished, differentiated, accessible, and regression-free, with unresolved SDK work isolated behind a separate authority gate."
    cadence: "after each Worker package and at final audit"
    final_proof: "Browser walkthrough, automated tests/build, independent UX review, PR Review Toolkit receipt, and exact feature-off Classic proof."
  intake:
    original_request: "Plan the polish work from the independent UX critique before presenting the composable-flow feature set."
    interpreted_outcome: "Finish the website showcase first, then hand off SDK-level attachment and Classic accessibility corrections as a separate linked tranche."
    input_shape: existing_plan
    audience: "Prospective BugDrop users evaluating the composable-flow SDK"
    authority: requested
    proof_type: demo
    completion_proof: "All in-scope website findings are corrected and proven locally; SDK work has an exact bounded child plan and remains unexecuted until separately authorized."
    likely_misfire: "Making the examples technically comprehensive but visually dense, or silently expanding the website tranche into an SDK release."
    blind_spots_considered:
      - "Mobile launcher overlap"
      - "Feature Request pacing and viewport overflow"
      - "Bug Report attachment presentation"
      - "Chooser differentiation"
      - "Onboarding guidance-versus-blocked language"
      - "Classic accessibility and immutable runtime boundaries"
    existing_plan_facts:
      - "Independent UX critique found no P0 issues and three P1 presentation issues."
      - "User selected two linked tranches: website/configuration first, SDK patch/release/repin second."
      - "Public homepage feature flag stays off during dogfood."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/homepage-composable-showcase-polish/"
